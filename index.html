<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white text-black">

  <main class="max-w-6xl mx-auto px-6">

    <!-- Header -->
    <header class="py-20 grid grid-cols-12">
      <div class="col-span-6">
        <h1 class="text-4xl tracking-tight">Aaron Simpson</h1>
      </div>
      <div class="col-span-6 text-right text-sm text-gray-500">
        Graphic Design Studio
      </div>
    </header>

    <!-- Work Grid -->
    <section class="grid grid-cols-12 gap-y-20 gap-x-6">

      <!-- Project -->
      <div class="col-span-12 md:col-span-8 group">
        <div class="overflow-hidden">
          <img src="https://aaronsimpson330-cyber.github.io/Portfolio/Images/1200x800_Emails.png" class="w-full transform transition duration-700 ease-out group-hover:scale-105" />
        </div>
        <div class="mt-3 flex justify-between text-sm">
          <span>Brand Identity</span>
          <span class="text-gray-400">2026</span>
        </div>
      </div>

      <div class="col-span-12 md:col-span-4 group md:mt-20">
        <div class="overflow-hidden">
          <img src="https://via.placeholder.com/600x800" class="w-full transform transition duration-700 ease-out group-hover:scale-105" />
        </div>
        <div class="mt-3 flex justify-between text-sm">
          <span>Poster Series</span>
          <span class="text-gray-400">2026</span>
        </div>
      </div>

      <div class="col-span-12 md:col-span-6 group">
        <div class="overflow-hidden">
          <img src="https://via.placeholder.com/800x600" class="w-full transform transition duration-700 ease-out group-hover:scale-105" />
        </div>
        <div class="mt-3 flex justify-between text-sm">
          <span>Campaign Design</span>
          <span class="text-gray-400">2025</span>
        </div>
      </div>

      <div class="col-span-12 md:col-span-6 group md:mt-20">
        <div class="overflow-hidden">
          <img src="https://via.placeholder.com/800x600" class="w-full transform transition duration-700 ease-out group-hover:scale-105" />
        </div>
        <div class="mt-3 flex justify-between text-sm">
          <span>Editorial Layout</span>
          <span class="text-gray-400">2025</span>
        </div>
      </div>

    </section>

    <!-- About -->
    <section class="grid grid-cols-12 py-24 border-t mt-24">
      <div class="col-span-12 md:col-span-6">
        <p class="text-lg leading-relaxed">
          A design studio focused on clarity, typography, and refined visual systems. We create timeless identities and digital experiences.
        </p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="grid grid-cols-12 py-12 border-t text-sm text-gray-500">
      <div class="col-span-6">your@email.com</div>
      <div class="col-span-6 text-right">Instagram / Behance</div>
    </footer>

  </main>

</body>
</html>
