<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111;
      color: white;
    }

    nav a {
      margin: 0 15px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
      background: white;
    }

    .hero h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    .portfolio {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .project {
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .project img {
      width: 100%;
      border-radius: 8px;
    }

    .project h3 {
      margin: 10px 0 5px;
    }

    .about, .contact {
      padding: 40px 20px;
      text-align: center;
      background: white;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h2>Your Name</h2>
  <nav>
    <a href="#portfolio">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Graphic Designer</h1>
  <p>Branding • Print • Digital</p>
</section>

<section id="portfolio" class="portfolio">
  <div class="project">
    <img src="https://via.placeholder.com/400" alt="Project 1">
    <h3>Project Title</h3>
    <p>Short description</p>
  </div>

  <div class="project">
    <img src="https://via.placeholder.com/400" alt="Project 2">
    <h3>Project Title</h3>
    <p>Short description</p>
  </div>

  <div class="project">
    <img src="https://via.placeholder.com/400" alt="Project 3">
    <h3>Project Title</h3>
    <p>Short description</p>
  </div>
</section>

<section id="about" class="about">
  <h2>About Me</h2>
  <p>Write a short bio about your work, style, and experience.</p>
</section>

<section id="contact" class="contact">
  <h2>Contact</h2>
  <p>Email: your@email.com</p>
</section>

<footer>
  <p>© 2026 Your Name</p>
</footer>

</body>
</html>
